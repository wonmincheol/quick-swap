[mod-name]
quick-swap=Quick Swap

[mod-description]
quick-swap=Quickly swap held belts, pipes, and electric poles with the mouse wheel.

[controls]
quick-swap-cycle-kind-next=Quick item swap: Next
quick-swap-cycle-kind-previous=Quick item swap: Previous
quick-swap-cycle-tier-next=Belt tier swap: Higher
quick-swap-cycle-tier-previous=Belt tier swap: Lower

[controls-description]
quick-swap-cycle-kind-next=Switch to the next belt type, pipe form, or higher electric pole in the same group.
quick-swap-cycle-kind-previous=Switch to the previous belt type, pipe form, or lower electric pole in the same group.
quick-swap-cycle-tier-next=Switch to a higher tier while keeping the current belt type.
quick-swap-cycle-tier-previous=Switch to a lower tier while keeping the current belt type.
