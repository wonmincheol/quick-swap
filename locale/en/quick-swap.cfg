[mod-name]
quick-swap=Quick Swap
[mod-description]
quick-swap=Swap building items in custom groups using Shift/Ctrl and the mouse wheel.
[controls]
quick-swap-cycle-kind-next=Horizontal swap: Right
quick-swap-cycle-kind-previous=Horizontal swap: Left
quick-swap-cycle-tier-next=Vertical swap: Row below
quick-swap-cycle-tier-previous=Vertical swap: Row above
[controls-description]
quick-swap-cycle-kind-next=Move right within the same row.
quick-swap-cycle-kind-previous=Move left within the same row.
quick-swap-cycle-tier-next=Move down within the same column. Higher tier in the default belt group.
quick-swap-cycle-tier-previous=Move up within the same column. Lower tier in the default belt group.
[quick-swap]
