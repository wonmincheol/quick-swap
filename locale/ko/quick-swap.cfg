[mod-name]
quick-swap=Quick Swap
[mod-description]
quick-swap=사용자 정의 그룹에서 Shift·Ctrl과 마우스 휠로 건설 아이템을 전환합니다.
[controls]
quick-swap-cycle-kind-next=가로 전환: 오른쪽
quick-swap-cycle-kind-previous=가로 전환: 왼쪽
quick-swap-cycle-tier-next=세로 전환: 아래 행
quick-swap-cycle-tier-previous=세로 전환: 위 행
[controls-description]
quick-swap-cycle-kind-next=같은 행에서 오른쪽으로 이동합니다.
quick-swap-cycle-kind-previous=같은 행에서 왼쪽으로 이동합니다.
quick-swap-cycle-tier-next=같은 열에서 아래 행으로 이동합니다. 기본 벨트에서는 상위 티어입니다.
quick-swap-cycle-tier-previous=같은 열에서 위 행으로 이동합니다. 기본 벨트에서는 하위 티어입니다.
[quick-swap]
open=전환 그룹 편집
master=빠른 전환 사용
belts=벨트
pipes=파이프
poles=전신주
horizontal=가로 ↻
vertical=세로 ↻
wrap-help=해당 축의 끝에서 반대쪽으로 순환합니다.
rename=그룹 이름 수정
delete=그룹 삭제
add=+ 그룹 추가
new-group=새 그룹 __1__
slot-help=슬롯 클릭: 아이템 선택 · 우클릭: 비우기
locked=미해금·지원 제외 또는 사라진 아이템입니다. 전환 시 건너뜁니다.
keys-horizontal=→ __CONTROL__quick-swap-cycle-kind-next__   ← __CONTROL__quick-swap-cycle-kind-previous__
keys-vertical=↓ __CONTROL__quick-swap-cycle-tier-next__   ↑ __CONTROL__quick-swap-cycle-tier-previous__
group-up=그룹을 위로 이동합니다. 위쪽의 활성 그룹이 우선합니다.
group-down=그룹을 아래로 이동합니다. 위쪽의 활성 그룹이 우선합니다.
order-help=그룹 순서를 변경했습니다. 적용하면 위쪽의 활성 그룹이 우선합니다.
size=가로 10칸 고정 · 마지막 행 사용 시 세로 확장
confirm=확인
cancel=취소
apply=적용
confirm-delete=이 그룹을 삭제할까요? 적용 전까지 취소할 수 있습니다.
confirm-discard=적용하지 않은 변경을 버리고 닫을까요?
name-required=그룹 이름을 입력하세요.
invalid=배열에 중복되거나 잘못된 항목이 있습니다.
unavailable=현재 해금된 일반 건설 아이템만 등록할 수 있습니다.
duplicate=같은 그룹에 이미 등록된 아이템입니다.
priority=여러 그룹에 등록되어 있습니다. 위쪽의 사용 중인 그룹이 우선합니다.
