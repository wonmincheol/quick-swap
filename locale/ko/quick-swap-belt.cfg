[mod-name]
quick-swap-belt=빠른 벨트 전환

[mod-description]
quick-swap-belt=마우스 휠로 손에 든 벨트, 파이프, 전신주를 빠르게 전환합니다.

[controls]
quick-swap-belt-cycle-kind-next=빠른 아이템 전환: 다음
quick-swap-belt-cycle-kind-previous=빠른 아이템 전환: 이전
quick-swap-belt-cycle-tier-next=벨트 등급 전환: 상위
quick-swap-belt-cycle-tier-previous=벨트 등급 전환: 하위

[controls-description]
quick-swap-belt-cycle-kind-next=같은 그룹의 다음 벨트 종류, 파이프 형태 또는 상위 전신주로 전환합니다.
quick-swap-belt-cycle-kind-previous=같은 그룹의 이전 벨트 종류, 파이프 형태 또는 하위 전신주로 전환합니다.
quick-swap-belt-cycle-tier-next=현재 벨트 종류를 유지하면서 더 높은 등급으로 전환합니다.
quick-swap-belt-cycle-tier-previous=현재 벨트 종류를 유지하면서 더 낮은 등급으로 전환합니다.
